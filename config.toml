baseURL = "https://wal8800.github.io/"
languageCode = "en-us"
title = "Engineering Journal"
theme = "PaperMod"

[params]
  description = "A place to note things down."
  author = "wal8800"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  math = true

[params.homeInfoParams]
  Title = "Engineering Journal"
  Content = "A place to note things down."

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['$$', '$$'], ['\[', '\]']]
          inline = [['$', '$'], ['\(', '\)']]
  [markup.highlight]
    codeFences = true
    style = "monokai"
